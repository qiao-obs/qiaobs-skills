    <g stroke="#7C3AED" stroke-width="3" fill="none"><rect x="605" y="420" width="84" height="15" rx="4"/><rect x="605" y="442" width="66" height="15" rx="4"/><rect x="605" y="464" width="48" height="15" rx="4"/><path d="M700 435l16 15 28-35" stroke-width="4"/></g>
