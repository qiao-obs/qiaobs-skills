<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">qiaobs-skills capability map</title>
  <desc id="desc">Three focused, evidence-first capability cards: trace, execute, and update.</desc>
  <rect width="1600" height="720" fill="#F6F8FC"/>
  <g stroke="#E9EEF5" stroke-width="1">
    <path d="M56 30V690M136 30V690M216 30V690M296 30V690M376 30V690M456 30V690M536 30V690M616 30V690M696 30V690M776 30V690M856 30V690M936 30V690M1016 30V690M1096 30V690M1176 30V690M1256 30V690M1336 30V690M1416 30V690M1496 30V690"/>
    <path d="M30 40H1570M30 120H1570M30 200H1570M30 280H1570M30 360H1570M30 440H1570M30 520H1570M30 600H1570M30 680H1570"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0B1220">
    <text x="78" y="125" font-size="54" font-weight="700">qiaobs-skills</text>
    <text x="82" y="170" font-size="22" font-weight="700" fill="#2563EB">TRACE / EXECUTE / UPDATE</text>
    <text x="82" y="222" font-size="29" fill="#334155">Reality-tested skills for work that must survive</text>
    <text x="82" y="260" font-size="29" fill="#334155">the path from intention to evidence.</text>
  </g>
