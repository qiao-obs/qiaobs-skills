    <text x="125" y="545" font-size="27" font-weight="700">TRACE</text><text x="125" y="586" font-size="20" fill="#334155">Find the first mismatch</text>
    <text x="605" y="545" font-size="27" font-weight="700">EXECUTE</text><text x="605" y="586" font-size="20" fill="#334155">Complete bounded work</text>
    <text x="1085" y="545" font-size="27" font-weight="700">UPDATE</text><text x="1085" y="586" font-size="20" fill="#334155">Let evidence revise the plan</text>
    <text x="80" y="670" font-size="18" fill="#94A3B8">Three focused capabilities. Composable by need, never by habit.</text>
